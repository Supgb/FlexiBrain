[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexibrain"
version = "0.1.0"
description = "Flexible-resolution fMRI Mamba-JEPA pretraining and downstream classification"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}
dependencies = [
  "numpy==1.26.2",
  "pandas==2.1.3",
  "PyYAML==6.0.1",
  "nibabel==5.3.2",
  "isal>=1.7.0",
  "scikit-learn==1.3.2",
  "timm==1.0.22",
  "einops==0.7.0",
  "packaging>=23.2",
]

[project.optional-dependencies]
cuda = [
  "torch==2.7.1+cu128",
  "torchvision==0.22.1+cu128",
  "torchaudio==2.7.1+cu128",
  "causal-conv1d==1.6.2.post1",
  "mamba-ssm==2.2.6.post3",
  "transformers==4.40.2",
]
preprocess = [
  "nilearn==0.10.3",
  "tqdm==4.66.1",
]

[project.scripts]
flexibrain = "flexibrain.cli:main"

[tool.setuptools]
packages = {find = {include = ["flexibrain*"]}}
include-package-data = true

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
causal-conv1d = { url = "https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.6.2.post1/causal_conv1d-1.6.2.post1%2Bcu12torch2.7cxx11abiTRUE-cp310-cp310-linux_x86_64.whl" }
mamba-ssm = { url = "https://github.com/state-spaces/mamba/releases/download/v2.2.6.post3/mamba_ssm-2.2.6.post3%2Bcu12torch2.7cxx11abiTRUE-cp310-cp310-linux_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
