dataset: abide1
default_scheme: null
default_drop_initial_trs: 5
description: >
  Verified slice acquisition protocols for ABIDE I sites from the official INDI
  scan_params PDFs and site summaries. Stanford is explicitly treated identically
  to UM_1 / UM_2 (sequential ascending).
sites:
  # Sequential ascending (Feet -> Head)
  KKI: seq_asc
  Leuven_1: seq_asc
  Leuven_2: seq_asc
  Olin: seq_asc
  Trinity: seq_asc
  UM_1: seq_asc
  UM_2: seq_asc
  Stanford: seq_asc

  # Sequential descending (Head -> Feet)
  SBL: seq_desc

  # Siemens interleaved, Transversal F >> H (even N -> even-indexed 1-based first; odd N -> odd-indexed 1-based first)
  CMU_a: siemens_interleaved_fh
  CMU_b: siemens_interleaved_fh
  CMU: siemens_interleaved_fh
  Caltech: siemens_interleaved_fh
  NYU_a: siemens_interleaved_fh
  NYU_b: siemens_interleaved_fh
  NYU_c: siemens_interleaved_fh
  NYU_d: siemens_interleaved_fh
  NYU_e: siemens_interleaved_fh
  NYU: siemens_interleaved_fh
  OHSU: siemens_interleaved_fh
  Pitt: siemens_interleaved_fh
  UCLA_1: siemens_interleaved_fh
  UCLA_2: siemens_interleaved_fh
  USM: siemens_interleaved_fh
  Yale: siemens_interleaved_fh

  # Siemens interleaved, Transversal H >> F
  MaxMun_a: siemens_interleaved_hf
  MaxMun_b: siemens_interleaved_hf
  MaxMun_c: siemens_interleaved_hf
  MaxMun_d: siemens_interleaved_hf
  MaxMun: siemens_interleaved_hf

  # GE interleaved bottom-up (always odd-first 1-based / 0,2,... then 1,3,... regardless of parity)
  SDSU: ge_interleaved_asc
